apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    app: kubesynapse
    component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      app: kubesynapse
      component: agent
  template:
    metadata:
      labels:
        app: kubesynapse
        component: agent
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      containers:
        - name: kubesynapse
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: RESTART_THRESHOLD
              value: {{ .Values.agent.config.restartThreshold | quote }}
            - name: COOLDOWN_SECONDS
              value: {{ .Values.agent.config.cooldownSeconds | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.agent.config.healthPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.agent.config.metricsPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.agent.config.logLevel | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.agent.config.clusterName | quote }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.agent.config.watchNamespaces | quote }}
            - name: WEBHOOK_URL
              value: {{ .Values.agent.config.webhookUrl | quote }}
            - name: WEBHOOK_TYPE
              value: {{ .Values.agent.config.webhookType | quote }}
            - name: WEBHOOK_HEADERS
              value: {{ .Values.agent.config.webhookHeaders | toJson | quote }}
            - name: LOG_TAIL_LINES
              value: {{ .Values.agent.config.logTailLines | quote }}
            - name: DEDUPLICATION_MODE
              value: {{ .Values.agent.config.deduplicationMode | quote }}
            - name: PERSISTENCE_PATH
              value: {{ .Values.agent.config.persistencePath | quote }}
            - name: REDIS_URL
              value: {{ .Values.agent.config.redisUrl | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.agent.config.redisPassword | quote }}
            - name: REDIS_USE_TLS
              value: {{ .Values.agent.config.redisUseTLS | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.config.healthPort }}
            - name: metrics
              containerPort: {{ .Values.agent.config.metricsPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- if .Values.agent.persistence.enabled }}
          volumeMounts:
            - name: agent-data
              mountPath: "/data"
          {{- end }}
      {{- if .Values.agent.persistence.enabled }}
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-agent-data
      {{- end }}
