name: CI - KubeSynapse Agency Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-charts:
    name: "Helm Chart Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Agent Chart
        run: helm lint charts/kubesynapse

  agent-ci:
    name: "Agent CI (Go)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: kubesynapse-agent/go.sum

      - name: Go Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: kubesynapse-agent

      - name: Build Agent
        run: |
          cd kubesynapse-agent
          go mod tidy
          go build ./cmd/kubesynapse/

      - name: Run Tests with Coverage
        run: |
          cd kubesynapse-agent
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: kubesynapse-agent/coverage.out
          flags: agent
          name: codecov-umbrella
          fail_ci_if_error: false # Don't fail if Codecov is down
