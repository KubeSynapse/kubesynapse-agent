name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # depending on default permission settings for your org (template)
    # you may need this to allow write access to GitHub Releases
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Auto-increment Chart Version
        run: |
          # Get the latest tag — if none exist, start fresh at 1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ "$LATEST_TAG" = "none" ]; then
            NEW_VERSION="1.0.0"
          else
            LATEST_VERSION=${LATEST_TAG#kubesynapse-}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Update Chart.yaml and values.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" charts/kubesynapse/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$NEW_VERSION\"/" charts/kubesynapse/Chart.yaml
          sed -i "s/tag: .*/tag: \"$NEW_VERSION\"/" charts/kubesynapse/values.yaml

          # Only commit + push if something actually changed
          git add charts/kubesynapse/Chart.yaml charts/kubesynapse/values.yaml
          if git diff --staged --quiet; then
            echo "Version files already at $NEW_VERSION — skipping commit"
          else
            git commit -m "chore: release v$NEW_VERSION"
            git push origin main
          fi

          # Always create and push the tag (it won't exist at this point)
          git tag "kubesynapse-$NEW_VERSION"
          git push origin "kubesynapse-$NEW_VERSION"


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version From Latest Tag
        id: version
        run: |
          echo "version=${{ env.NEW_VERSION }}" >> $GITHUB_OUTPUT
          echo "tag=kubesynapse-${{ env.NEW_VERSION }}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kubesynapse-agent
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: kubesynapse-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true
