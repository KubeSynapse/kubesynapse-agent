apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  CLUSTER_NAME: {{ .Values.agent.config.clusterName | quote }}
  WATCH_NAMESPACES: {{ .Values.agent.config.watchNamespaces | quote }}
  DEDUPLICATION_MODE: {{ .Values.agent.config.deduplicationMode | quote }}
  PERSISTENCE_PATH: {{ .Values.agent.config.persistencePath | quote }}
  WEBHOOK_URL: {{ .Values.agent.config.webhookUrl | quote }}
  WEBHOOK_HEADERS: {{ toJson .Values.agent.config.webhookHeaders | quote }}
  REDIS_URL: {{ .Values.agent.config.redisUrl | quote }}
  REDIS_PASSWORD: {{ .Values.agent.config.redisPassword | quote }}
  REDIS_USE_TLS: {{ .Values.agent.config.redisUseTLS | quote }}
  RESTART_THRESHOLD: {{ .Values.agent.config.restartThreshold | quote }}
  COOLDOWN_SECONDS: {{ .Values.agent.config.cooldownSeconds | quote }}
  LOG_TAIL_LINES: {{ .Values.agent.config.logTailLines | quote }}
  HEALTH_PORT: {{ .Values.agent.config.healthPort | quote }}
  METRICS_PORT: {{ .Values.agent.config.metricsPort | quote }}
  LOG_LEVEL: {{ .Values.agent.config.logLevel | quote }}
