{{- if .Values.agent.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubesynapse.fullname" . }}-agent-data
  labels:
    {{- include "kubesynapse.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.agent.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.agent.persistence.size | default "1Gi" }}
  {{- if .Values.agent.persistence.storageClass }}
  storageClassName: {{ .Values.agent.persistence.storageClass }}
  {{- end }}
{{- end }}
